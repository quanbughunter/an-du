<div class="app" id="app">
  <aside class="rail" aria-label="Điều hướng">
    <div class="wordmark"><span class="wordmark-dot" aria-hidden="true"></span>Ăn Đủ</div>
    <button class="rail-btn" data-nav="today"><svg class="icon"><use href="#i-plate"/></svg>Hôm nay</button>
    <button class="rail-btn" data-nav="foods"><svg class="icon"><use href="#i-book"/></svg>Thực phẩm</button>
    <button class="rail-btn" data-nav="progress"><svg class="icon"><use href="#i-chart"/></svg>Tiến trình</button>
    <button class="rail-btn" data-nav="profile"><svg class="icon"><use href="#i-user"/></svg>Hồ sơ</button>
    <button class="btn brand rail-add" data-action="quick-add"><svg class="icon"><use href="#i-plus"/></svg>Thêm món</button>
    <p class="rail-foot">Dữ liệu lưu trên thiết bị của bạn.</p>
  </aside>

  <main class="main" id="main">
    <section class="view" id="v-today" aria-label="Hôm nay"></section>
    <section class="view" id="v-foods" aria-label="Thực phẩm" hidden></section>
    <section class="view" id="v-progress" aria-label="Tiến trình" hidden></section>
    <section class="view" id="v-profile" aria-label="Hồ sơ" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Điều hướng">
    <button class="tab" data-nav="today"><svg class="icon"><use href="#i-plate"/></svg>Hôm nay</button>
    <button class="tab" data-nav="foods"><svg class="icon"><use href="#i-book"/></svg>Thực phẩm</button>
    <button class="fab" data-action="quick-add" aria-label="Thêm món ăn"><svg class="icon"><use href="#i-plus"/></svg></button>
    <button class="tab" data-nav="progress"><svg class="icon"><use href="#i-chart"/></svg>Tiến trình</button>
    <button class="tab" data-nav="profile"><svg class="icon"><use href="#i-user"/></svg>Hồ sơ</button>
  </nav>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" data-action="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="file-import" accept=".json,application/json,text/plain" hidden>
