/* Layout: app shell — tab bar on phones, side rail on wide screens; every day is a "đĩa" (plate) whose rim turns amber / green / red */
:root {
  --bg: #F5F4FF;
  --surface: #FFFFFF;
  --surface-2: #EEEDFB;
  --ink: #29233F;
  --ink-2: #6C6789;
  --ink-3: #9C98B6;
  --line: #E4E2F3;
  --brand: #E6407E;
  --brand-soft: #FFE3EE;
  --cta: #29233F;
  --cta-ink: #FFFFFF;

  --carb: #5B95F5;  --carb-soft: #E1ECFF;
  --pro: #9B74F2;   --pro-soft: #EEE6FF;
  --fat: #EFB823;   --fat-soft: #FFF3CF;
  --fib: #22B39A;   --fib-soft: #D8F5EE;
  --peach: #FF9F7A; --peach-soft: #FFE9DF;
  --pink: #F2709E;  --pink-soft: #FFE4EE;
  --sky: #45B4E8;   --sky-soft: #DDF3FD;

  --low: #EE8A13;   --low-soft: #FFEED8;  --low-ink: #9A5200;
  --ok: #1FA463;    --ok-soft: #DCF6E8;   --ok-ink: #0D6B3D;
  --high: #E5484D;  --high-soft: #FFE2E3; --high-ink: #A3191E;

  --meal-s: #FFF1C9; --meal-t: #D9F6EA; --meal-c: #E9E3FF; --meal-p: #FFE6DA;
  --shadow: 0 14px 34px -18px rgba(64, 48, 140, .35);
  --shadow-sm: 0 4px 14px -8px rgba(64, 48, 140, .3);
  --font-display: 'Baloo 2', 'Be Vietnam Pro', system-ui, sans-serif;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r-lg: 26px; --r-md: 18px; --r-sm: 12px;
  --tabbar-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15122A; --surface: #211D3A; --surface-2: #2B2649; --ink: #F2EFFF; --ink-2: #ADA7CC; --ink-3: #7D77A0; --line: #37315A;
    --brand: #FF6B9E; --brand-soft: #46213A; --cta: #F2EFFF; --cta-ink: #1B1733;
    --carb: #7AAAFF; --carb-soft: #1F3054; --pro: #B597FF; --pro-soft: #31265A; --fat: #F5C84B; --fat-soft: #403417; --fib: #3CCFB2; --fib-soft: #173F39;
    --peach: #FFB094; --peach-soft: #46291F; --pink: #FF8AB3; --pink-soft: #45213A; --sky: #6CC8F2; --sky-soft: #173A4C;
    --low: #FFA53D; --low-soft: #45301A; --low-ink: #FFC27A; --ok: #3DD28A; --ok-soft: #163D2C; --ok-ink: #8CEBBD; --high: #FF6B6F; --high-soft: #4A1F27; --high-ink: #FFA3A6;
    --meal-s: #3E3418; --meal-t: #173B30; --meal-c: #2E2753; --meal-p: #432A20;
    --shadow: 0 14px 34px -18px rgba(0, 0, 0, .7); --shadow-sm: 0 4px 14px -8px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15122A; --surface: #211D3A; --surface-2: #2B2649; --ink: #F2EFFF; --ink-2: #ADA7CC; --ink-3: #7D77A0; --line: #37315A;
  --brand: #FF6B9E; --brand-soft: #46213A; --cta: #F2EFFF; --cta-ink: #1B1733;
  --carb: #7AAAFF; --carb-soft: #1F3054; --pro: #B597FF; --pro-soft: #31265A; --fat: #F5C84B; --fat-soft: #403417; --fib: #3CCFB2; --fib-soft: #173F39;
  --peach: #FFB094; --peach-soft: #46291F; --pink: #FF8AB3; --pink-soft: #45213A; --sky: #6CC8F2; --sky-soft: #173A4C;
  --low: #FFA53D; --low-soft: #45301A; --low-ink: #FFC27A; --ok: #3DD28A; --ok-soft: #163D2C; --ok-ink: #8CEBBD; --high: #FF6B6F; --high-soft: #4A1F27; --high-ink: #FFA3A6;
  --meal-s: #3E3418; --meal-t: #173B30; --meal-c: #2E2753; --meal-p: #432A20;
  --shadow: 0 14px 34px -18px rgba(0, 0, 0, .7); --shadow-sm: 0 4px 14px -8px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--carb); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; font-weight: 700; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.icon { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 18px; height: 18px; }

/* ---------- Shell ---------- */
.app { min-height: 100vh; }
.main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 8px calc(var(--tabbar-h) + 36px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 18px; }
.rail { display: none; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
  padding: 0 8px env(safe-area-inset-bottom, 0px);
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 8px 0; color: var(--ink-3); font-size: 11.5px; font-weight: 600; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .icon { stroke: var(--brand); }
.fab {
  justify-self: center; width: 56px; height: 56px; margin-top: -26px; border-radius: 20px; border: 0;
  background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: 0 10px 24px -8px color-mix(in srgb, var(--brand) 70%, transparent);
  transition: transform .15s ease;
}
.fab:active { transform: scale(.94); }
.fab .icon { width: 28px; height: 28px; stroke-width: 2.6; }

@media (min-width: 1000px) {
  .app { display: grid; grid-template-columns: 236px 1fr; }
  .tabbar { display: none; }
  .main { padding-block: 24px 48px; padding-inline: 32px; width: 100%; }
  .rail {
    display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh;
    padding: 28px 18px; border-right: 1px solid var(--line); background: var(--surface);
  }
  .rail .wordmark { margin: 0 8px 22px; }
  .rail-btn { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 0; background: none; color: var(--ink-2); font-weight: 600; text-align: left; }
  .rail-btn:hover { background: var(--surface-2); color: var(--ink); }
  .rail-btn[aria-current="page"] { background: var(--brand-soft); color: var(--ink); }
  .rail-btn[aria-current="page"] .icon { stroke: var(--brand); }
  .rail-add { margin-top: 14px; justify-content: center; }
  .rail-foot { margin-top: auto; font-size: 12px; color: var(--ink-3); padding: 0 8px; }
}

/* ---------- Wordmark ---------- */
.wordmark { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 800; font-size: 25px; letter-spacing: -.01em; line-height: 1; }
.wordmark-dot { width: 30px; height: 30px; border-radius: 50%; flex: none; background: conic-gradient(var(--carb) 0 45%, var(--pro) 45% 72%, var(--fat) 72% 90%, var(--fib) 90% 100%); position: relative; }
.wordmark-dot::after { content: ""; position: absolute; top: 7px; right: 7px; bottom: 7px; left: 7px; border-radius: 50%; background: var(--surface); }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px; }
.topbar .wordmark { font-size: 23px; }
@media (min-width: 1000px) { .topbar .wordmark { display: none; } }
.iconbtn { width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); flex: none; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn.ghost { border-color: transparent; background: transparent; }
.topbar .avatar { margin-left: auto; }
.avatar { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--pro-soft); color: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 18px; display: grid; place-items: center; }

.datebar { display: flex; align-items: center; gap: 8px; }
.datebar .date-label { flex: 1; min-width: 0; text-align: center; border: 0; background: none; padding: 4px; }
.date-label strong { display: block; font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.2; }
.date-label span { font-size: 12.5px; color: var(--ink-2); }
.date-input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

/* ---------- Week strip ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0 9px; border-radius: 16px; border: 0; background: none; color: var(--ink-2); font-size: 12px; font-weight: 600; }
.wday[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.wday .mini { width: 34px; height: 34px; }
.wday .d { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1; }
.wday.is-today .d { color: var(--brand); }

/* ---------- Demo banner ---------- */
.demo { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--sky-soft); border: 1px dashed var(--sky); font-size: 14px; }
.demo p { flex: 1; min-width: 0; }

/* ---------- Today layout ---------- */
.today-grid { display: flex; flex-direction: column; gap: 18px; }
.today-side, .today-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
@media (min-width: 1000px) {
  .today-grid { display: grid; grid-template-columns: minmax(340px, 400px) 1fr; align-items: start; gap: 28px; }
}

/* ---------- Plate (hero) ---------- */
.plate-card { position: relative; border-radius: 32px; padding: 22px 20px 20px; background: var(--st-soft, var(--surface-2)); transition: background-color .4s ease; overflow: hidden; }
.plate-card[data-st="low"] { --st: var(--low); --st-soft: var(--low-soft); --st-ink: var(--low-ink); }
.plate-card[data-st="ok"] { --st: var(--ok); --st-soft: var(--ok-soft); --st-ink: var(--ok-ink); }
.plate-card[data-st="high"] { --st: var(--high); --st-soft: var(--high-soft); --st-ink: var(--high-ink); }
.plate-card[data-st="none"] { --st: var(--ink-3); --st-soft: var(--surface-2); --st-ink: var(--ink-2); }
.plate-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.plate-head h2 { font-size: 20px; }
.status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 9px; border-radius: 999px; font-weight: 700; font-size: 13px; background: var(--surface); color: var(--st-ink, var(--ink)); white-space: nowrap; }
.status-pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--st, var(--ink-3)); }
.plate-wrap { position: relative; width: 268px; max-width: 100%; margin: 14px auto 6px; }
.plate-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.plate-center { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.plate-center .big { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: .95; letter-spacing: -.02em; }
.plate-center .of { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.plate-center .left { margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--st-ink); }
.plate-rim-track { stroke: var(--line); stroke: color-mix(in srgb, var(--st) 22%, var(--surface)); }
.plate-rim { stroke: var(--st); transition: stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1); }
.plate-over { stroke: var(--high-ink); }
.plate-dish { fill: var(--surface); }
.plate-dish-shadow { fill: transparent; fill: color-mix(in srgb, var(--st) 14%, transparent); }
.plate-empty { stroke: var(--line); stroke-dasharray: 3 7; fill: none; }

.kcal-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.kcal-row div { background: var(--surface); background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 14px; padding: 8px 10px; text-align: center; }
.kcal-row b { display: block; font-family: var(--font-display); font-size: 19px; line-height: 1.1; }
.kcal-row span { font-size: 11.5px; color: var(--ink-2); }

/* ---------- Macro bars ---------- */
.macros { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; background: var(--surface); border-radius: 22px; padding: 14px 14px 12px; }
.macro { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.macro-name { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; min-width: 0; }
.macro-name i { width: 10px; height: 10px; border-radius: 4px; background: var(--mc); flex: none; }
.macro-name em { font-style: normal; font-weight: 500; color: var(--ink-2); font-size: 13px; }
.chip-st { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.chip-st[data-st="low"] { background: var(--low-soft); color: var(--low-ink); }
.chip-st[data-st="ok"] { background: var(--ok-soft); color: var(--ok-ink); }
.chip-st[data-st="high"] { background: var(--high-soft); color: var(--high-ink); }
.chip-st[data-st="none"] { background: var(--surface-2); color: var(--ink-2); }
.bar { grid-column: 1 / -1; position: relative; height: 10px; border-radius: 999px; background: var(--mc-soft); overflow: hidden; }
.bar b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--mc); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.bar s { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(-45deg, var(--high) 0 4px, color-mix(in srgb, var(--high) 55%, var(--surface)) 4px 8px); text-decoration: none; }
.m-carb { --mc: var(--carb); --mc-soft: var(--carb-soft); }
.m-pro { --mc: var(--pro); --mc-soft: var(--pro-soft); }
.m-fat { --mc: var(--fat); --mc-soft: var(--fat-soft); }
.m-fib { --mc: var(--fib); --mc-soft: var(--fib-soft); }

/* ---------- Advice ---------- */
.advice { background: var(--surface); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 14px; }
.advice h3 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
.advice h3 .icon { stroke: var(--brand); }
.tip { display: flex; gap: 12px; align-items: flex-start; }
.tip-mark { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--ink); }
.tip[data-st="low"] .tip-mark { background: var(--low-soft); color: var(--low-ink); }
.tip[data-st="ok"] .tip-mark { background: var(--ok-soft); color: var(--ok-ink); }
.tip[data-st="high"] .tip-mark { background: var(--high-soft); color: var(--high-ink); }
.tip-body { min-width: 0; flex: 1; }
.tip-body strong { display: block; font-size: 14.5px; }
.tip-body p { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.burn { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.burn span { display: inline-flex; gap: 5px; align-items: baseline; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); font-size: 12.5px; }
.burn b { font-family: var(--font-display); font-size: 15px; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sugg button { display: inline-flex; max-width: 100%; gap: 6px; align-items: center; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 600; text-align: left; }
.sugg button:hover { border-color: var(--ink-3); }
.sugg button .icon { width: 15px; height: 15px; stroke: var(--brand); }

/* ---------- Section heads ---------- */
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sec-head h2 { font-size: 22px; }
.seg { display: inline-flex; padding: 3px; border-radius: 14px; background: var(--surface-2); gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 11px; font-size: 13px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; justify-content: center; }

/* ---------- Meals ---------- */
.meals { display: flex; flex-direction: column; gap: 14px; }
.meal { border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
.meal-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 12px 16px; background: var(--meal-bg); }
.meal[data-meal="s"] { --meal-bg: var(--meal-s); }
.meal[data-meal="t"] { --meal-bg: var(--meal-t); }
.meal[data-meal="c"] { --meal-bg: var(--meal-c); }
.meal[data-meal="p"] { --meal-bg: var(--meal-p); }
.meal-title { flex: 1; min-width: 0; }
.meal-title h3 { font-size: 18px; }
.meal-title span { font-size: 12.5px; color: var(--ink-2); }
.meal-kcal { font-family: var(--font-display); font-weight: 800; font-size: 20px; white-space: nowrap; }
.meal-kcal small { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.add-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 12px; padding: 8px 12px; background: var(--surface); font-weight: 700; font-size: 13px; color: var(--ink); white-space: nowrap; }
.add-btn:hover { background: var(--surface-2); }
.items { list-style: none; margin: 0; padding: 4px 0; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; border: 0; background: none; text-align: left; }
.item:hover { background: var(--surface-2); }
.item + .item { border-top: 1px solid var(--line); }
.item-main { flex: 1; min-width: 0; }
.item-name { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub { font-size: 12.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 0 10px; }
.item-sub .mc { display: inline-flex; align-items: center; gap: 4px; }
.item-sub .mc i { width: 7px; height: 7px; border-radius: 3px; background: var(--mc); }
.item-kcal { font-family: var(--font-display); font-weight: 700; font-size: 17px; white-space: nowrap; }
.empty-meal { padding: 14px 16px 16px; font-size: 13.5px; color: var(--ink-2); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-color: var(--brand); text-underline-offset: 3px; font-size: 13.5px; }

/* ---------- Day table (sheet view) ---------- */
.table-wrap { overflow-x: auto; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
.daytable { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 620px; }
.daytable th, .daytable td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.daytable th:first-child, .daytable td:first-child { text-align: left; white-space: normal; min-width: 150px; }
.daytable thead th { font-size: 12px; color: var(--ink-2); font-weight: 700; background: var(--surface-2); position: sticky; top: 0; }
.daytable .grp td { background: var(--meal-bg); font-weight: 700; font-family: var(--font-display); font-size: 15px; }
.daytable tr[data-meal="s"] { --meal-bg: var(--meal-s); }
.daytable tr[data-meal="t"] { --meal-bg: var(--meal-t); }
.daytable tr[data-meal="c"] { --meal-bg: var(--meal-c); }
.daytable tr[data-meal="p"] { --meal-bg: var(--meal-p); }
.daytable input { width: 70px; text-align: right; padding: 5px 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-variant-numeric: tabular-nums; }
.daytable .tot td { font-weight: 800; background: var(--surface-2); }
.daytable .tgt td { color: var(--ink-2); }
.daytable td[data-st="low"] { color: var(--low-ink); font-weight: 700; }
.daytable td[data-st="ok"] { color: var(--ok-ink); font-weight: 700; }
.daytable td[data-st="high"] { color: var(--high-ink); font-weight: 700; }

/* ---------- Activities ---------- */
.acts { border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
.acts .meal-head { --meal-bg: var(--sky-soft); }

/* ---------- Generic cards & forms ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow-sm); }
.card h2 { font-size: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .field > label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input { width: 100%; padding: 11px 13px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--bg); font-size: 15px; min-width: 0; }
.input:focus { outline: none; border-color: var(--carb); background: var(--surface); }
.input-unit { position: relative; }
.input-unit .input { padding-right: 48px; }
.input-unit em { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ink-3); font-size: 13px; font-weight: 600; pointer-events: none; }
textarea.input { resize: vertical; min-height: 96px; line-height: 1.45; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 15px; border: 0; font-weight: 700; font-size: 15px; background: var(--surface-2); color: var(--ink); }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--cta); color: var(--cta-ink); }
.btn.brand { background: var(--brand); color: #fff; }
.btn.danger { background: var(--high-soft); color: var(--high-ink); }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--surface-2); }
.optcards { display: grid; gap: 8px; }
.optcard { display: flex; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface); padding: 11px 13px; border-radius: 15px; }
.optcard[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); }
.optcard b { display: block; font-size: 14.5px; }
.optcard span { font-size: 12.5px; color: var(--ink-2); }
.optcard .lvl { display: flex; gap: 3px; align-items: flex-end; height: 22px; flex: none; }
.optcard .lvl i { width: 5px; border-radius: 2px; background: var(--line); }
.optcard .lvl i.on { background: var(--brand); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.switch input { appearance: none; -webkit-appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .2s; }
.switch input:checked { background: var(--ok); }
.switch input:checked::after { transform: translateX(20px); }
.hint { font-size: 12.5px; color: var(--ink-2); }
.warn { font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--low-soft); color: var(--low-ink); }

/* ---------- Profile ---------- */
.prof-grid { display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 1000px) { .prof-grid { display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 24px; } .prof-col { display: flex; flex-direction: column; gap: 18px; } }
.prof-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border-radius: 16px; padding: 10px 12px; background: var(--surface-2); min-width: 0; }
.stat b { display: block; font-family: var(--font-display); font-size: 22px; line-height: 1.15; }
.stat span { font-size: 12px; color: var(--ink-2); }
.stat.hero { grid-column: 1 / -1; background: var(--brand-soft); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stat.hero b { font-size: 34px; }
.bmi { margin-top: 4px; }
.bmi-scale { position: relative; display: grid; grid-template-columns: 3.5fr 4.5fr 2fr 5fr 5fr; height: 12px; border-radius: 999px; overflow: hidden; margin: 0 0 6px; }
.bmi-scale i:nth-child(1) { background: var(--sky); }
.bmi-scale i:nth-child(2) { background: var(--ok); }
.bmi-scale i:nth-child(3) { background: var(--fat); }
.bmi-scale i:nth-child(4) { background: var(--low); }
.bmi-scale i:nth-child(5) { background: var(--high); }
.bmi-wrap { position: relative; padding-top: 30px; }
.bmi-pin { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.bmi-pin b { font-family: var(--font-display); font-size: 16px; line-height: 1; background: var(--ink); color: var(--surface); padding: 3px 8px; border-radius: 8px; }

.bmi-ticks { position: relative; height: 16px; font-size: 11px; color: var(--ink-2); }
.bmi-ticks span { position: absolute; transform: translateX(-50%); }
.mtargets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mt { border-radius: 16px; padding: 10px; background: var(--mc-soft); min-width: 0; }
.mt b { display: block; font-family: var(--font-display); font-size: 21px; line-height: 1.1; }

.formula { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }

/* ---------- Foods screen ---------- */
.searchbox { position: relative; }

.searchbox .input { padding-left: 42px; }
.flist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

.cat-ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; background: var(--cc-soft); color: var(--ink); }

.cc-pink { --cc: var(--pink); --cc-soft: var(--pink-soft); }

.star { border: 0; background: none; padding: 6px; color: var(--ink-3); border-radius: 10px; }

.star[aria-pressed="true"] .icon { fill: var(--fat); stroke: var(--fat); }
.foods-layout { display: flex; flex-direction: column; gap: 14px; }
.list-note { padding: 18px 6px; color: var(--ink-2); font-size: 14px; }
.groupname { font-family: var(--font-display); font-weight: 700; font-size: 16px; padding: 14px 6px 4px; color: var(--ink-2); }

/* ---------- Progress ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.kpi { background: var(--surface); border-radius: 20px; padding: 14px; box-shadow: var(--shadow-sm); }
.kpi b { display: block; font-family: var(--font-display); font-size: 26px; line-height: 1.1; }
.kpi span { font-size: 12.5px; color: var(--ink-2); }
.chart { width: 100%; display: block; }
.chart text { fill: var(--ink-2); font-family: var(--font-body); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tline { stroke: var(--ink); stroke-dasharray: 5 5; stroke-width: 1.5; }
.chart .b-low { fill: var(--low); }
.chart .b-ok { fill: var(--ok); }
.chart .b-high { fill: var(--high); }
.chart .b-none { fill: var(--line); }
.chart .wline { stroke: var(--pro); stroke-width: 2.5; fill: none; }
.chart .warea { fill: var(--pro-soft); opacity: .8; }
.chart .wdot { fill: var(--surface); stroke: var(--pro); stroke-width: 2.5; }
.chart .wlast { fill: var(--pro); }
.chart .tlabel { fill: var(--ink); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.avgm { display: flex; flex-direction: column; gap: 12px; }
.wlist { list-style: none; margin: 8px 0 0; padding: 0; }
.wlist li { display: flex; align-items: center; justify-content: space-between; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }

/* ---------- Sheet ---------- */
.sheet-wrap { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(28, 22, 54, .42); animation: fade .2s ease; }
.sheet {
  position: relative; width: 100%; max-width: 620px; max-height: 92vh; display: flex; flex-direction: column;
  background: var(--surface); border-radius: 28px 28px 0 0; box-shadow: var(--shadow);
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .26s cubic-bezier(.2,.8,.2,1);
}
.sheet-grip { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 10px auto 2px; flex: none; }
.sheet-body { overflow-y: auto; padding: 8px 18px 20px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.sheet-top { display: flex; align-items: center; gap: 10px; }
.sheet-top h2 { flex: 1; font-size: 22px; min-width: 0; }
.sheet-foot { position: sticky; bottom: -20px; padding: 12px 0 4px; background: linear-gradient(to bottom, transparent, var(--surface) 30%); }
@media (min-width: 700px) {
  .sheet-wrap { align-items: center; padding: 24px; }
  .sheet { border-radius: 28px; max-height: 88vh; }
  .sheet-grip { display: none; }
  .sheet-body { padding: 20px 24px 24px; }
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.preview { border-radius: 20px; padding: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
.preview-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.preview-top b { font-family: var(--font-display); font-size: 34px; line-height: 1; }
.preview-top span { font-size: 13px; color: var(--ink-2); }
.mini-macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mini-macros div { border-radius: 12px; padding: 7px 8px; background: var(--mc-soft); min-width: 0; }
.mini-macros b { display: block; font-family: var(--font-display); font-size: 17px; line-height: 1.1; }
.mini-macros span { font-size: 11.5px; color: var(--ink-2); }
.qty { display: grid; grid-template-columns: 1fr; gap: 10px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .input { text-align: center; font-family: var(--font-display); font-size: 22px; font-weight: 700; padding: 8px; }
.stepper .iconbtn { width: 48px; height: 48px; }
.parsed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.parsed li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 15px; background: var(--surface-2); }
.parsed li.miss { background: var(--low-soft); }
.parsed .p-main { flex: 1; min-width: 0; }
.parsed .p-name { font-weight: 700; font-size: 14px; }
.parsed .p-src { font-size: 12px; color: var(--ink-2); }
.parsed .p-k { font-family: var(--font-display); font-weight: 700; font-size: 16px; white-space: nowrap; }
.confirm { border-radius: 16px; padding: 14px; background: var(--high-soft); color: var(--high-ink); display: flex; flex-direction: column; gap: 10px; }
.nutable { width: 100%; border-collapse: collapse; font-size: 14px; }
.nutable td { padding: 8px 2px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.nutable td:last-child { text-align: right; font-weight: 700; }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--surface); padding: 11px 18px; border-radius: 14px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); animation: up .2s ease; }
@media (min-width: 1000px) { .toast { bottom: 28px; } }

@media (max-width: 380px) {
  .plate-center .big { font-size: 40px; }
  .mtargets { grid-template-columns: repeat(2, 1fr); }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .kcal-row b { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.plate-rim.anim { animation: draw 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }

/* ---------- Hồ sơ tương tác ---------- */
.me-card, .goal-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; border-radius: var(--r-lg); padding: 16px; background: var(--surface); box-shadow: var(--shadow-sm); color: var(--ink); transition: transform .12s ease, box-shadow .2s ease; }

.me-avatar { width: 56px; height: 56px; border-radius: 20px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--ink); background: linear-gradient(135deg, var(--pro-soft), var(--pink-soft)); }
.me-main, .goal-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.me-main b { font-family: var(--font-display); font-size: 21px; line-height: 1.15; }
.me-main span, .goal-main > span { font-size: 13.5px; color: var(--ink-2); }
.me-main em { font-style: normal; align-self: flex-start; margin-top: 4px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.edit-hint { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--ink-2); flex: none; }
.me-card.empty { border: 1.5px dashed var(--line); box-shadow: none; }
.goal-card { align-items: flex-start; background: var(--tone-soft, var(--surface)); padding: 18px 16px; }
.goal-card .goal-ic { margin-top: 2px; }
.goal-ic { width: 46px; height: 46px; border-radius: 16px; flex: none; display: grid; place-items: center; background: var(--surface); color: var(--tone, var(--ink)); }
.goal-ic .icon { stroke-width: 2.6; }
.goal-main .eyebrow { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.goal-main b { font-family: var(--font-display); font-size: 26px; line-height: 1.1; }
.tone-sky { --tone: var(--sky); --tone-soft: var(--sky-soft); }
.tone-fib { --tone: var(--fib); --tone-soft: var(--fib-soft); }
.tone-peach { --tone: var(--peach); --tone-soft: var(--peach-soft); }
.goal-card.empty { --tone-soft: var(--brand-soft); border: 1.5px dashed var(--brand); box-shadow: none; }
.goal-card.empty .goal-ic { background: var(--brand); color: #fff; }
.goal-card.empty b { font-size: 22px; }
.goal-prog { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
.goal-prog .bar { position: relative; height: 8px; border-radius: 999px; background: var(--surface); overflow: hidden; }
.goal-prog .bar b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--tone, var(--ok)); }

.targets { display: flex; flex-direction: column; gap: 12px; }
.targets .card-head { margin-bottom: 0; }
.tg-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tg-big b { font-family: var(--font-display); font-weight: 800; font-size: 52px; line-height: .95; letter-spacing: -.02em; }
.tg-big span { color: var(--ink-2); font-weight: 600; }
.tg-eq { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.tg-eq span { padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-weight: 600; }
.tg-eq .tg-eq-res { background: var(--brand-soft); color: var(--ink); }
.mix { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.mix i { display: block; min-width: 2px; }
.targets .warn { margin: 0; }
.targets.reveal { animation: pop .75s cubic-bezier(.2,.8,.2,1); }
@keyframes pop {
  0% { transform: scale(.96); box-shadow: 0 0 0 0 var(--brand); }
  45% { transform: scale(1.01); box-shadow: 0 0 0 8px var(--brand-soft); }
  100% { transform: none; box-shadow: var(--shadow-sm); }
}
details.how { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
details.how summary { cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink); list-style: none; display: flex; align-items: center; justify-content: space-between; }
details.how summary::-webkit-details-marker { display: none; }

/* sheet hồ sơ & mục tiêu */
.steps { display: flex; align-items: center; gap: 6px; margin-top: -6px; }
.steps i { width: 28px; height: 6px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--brand); }
.steps span { margin-left: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.numfield { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 6px; align-items: center; }
.numfield .iconbtn { width: 40px; height: 44px; border-radius: 12px; }
.numfield .input { text-align: center; padding-left: 6px; padding-right: 34px; font-weight: 700; }
.numfield .input-unit em { right: 8px; font-size: 12px; }
@media (max-width: 560px) { .numgrid { grid-template-columns: 1fr; } }
.goalopts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.goalopt { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 12px; border-radius: 18px; border: 2px solid transparent; background: var(--tone-soft); color: var(--ink); min-width: 0; }
.goalopt .goal-ic { width: 38px; height: 38px; border-radius: 13px; margin-bottom: 4px; }
.goalopt b { font-family: var(--font-display); font-size: 17px; line-height: 1.15; }
.goalopt span:last-child { font-size: 12px; color: var(--ink-2); line-height: 1.35; }

.rates { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.rate { display: flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; padding: 10px 12px; border-radius: 15px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.rate b { font-family: var(--font-display); font-size: 19px; line-height: 1.1; }
.rate span { font-size: 12px; color: var(--ink-2); }
.rate em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-top: 4px; }
.rate[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); }
.optcard.style > span { display: flex; flex-direction: column; gap: 2px; }
.mixrow { display: flex !important; flex-direction: column; gap: 4px; margin-top: 6px; }
.mixrow .num { font-size: 12px; color: var(--ink-2); }
.sheet-foot .live { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding: 10px 12px; margin-bottom: 10px; border-radius: 14px; background: var(--surface-2); font-size: 13px; color: var(--ink-2); }
.sheet-foot .live b { color: var(--ink); }
.sheet-foot .live .big { font-family: var(--font-display); font-size: 26px; line-height: 1; }
.sheet-foot .live .chip-st { margin-left: 4px; }

/* ---------- Calo đã tiêu ---------- */
.burn-card { border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
.burn-card .meal-head { --meal-bg: var(--pro-soft); }
.burn-body { display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 16px; }
.mix.tall { height: 14px; }
.burn-parts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.burn-parts li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.burn-parts li span { flex: 1; min-width: 0; }
.burn-parts li i { width: 10px; height: 10px; border-radius: 4px; flex: none; }
.burn-parts li b { color: var(--ink); font-family: var(--font-display); font-size: 15px; }
@media (max-width: 420px) { .burn-parts { grid-template-columns: 1fr; } }
.actq { display: flex; flex-direction: column; gap: 8px; }
.actq .searchbox .icon { color: var(--brand); }
.parsed .p-go { background: none; padding: 0; }
.burn-card .items { border-top: 1px solid var(--line); margin: 0 -16px; padding: 4px 0; }
.act-ic { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; }
.balance { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 16px; background: var(--surface-2); }
.bal-row { display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); }
.bal-row b { color: var(--ink); font-family: var(--font-display); font-size: 16px; min-width: 52px; text-align: right; }
.bal-bar { position: relative; height: 10px; border-radius: 999px; background: var(--surface); overflow: hidden; }
.bal-bar b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; min-width: 0 !important; }
.bal-res { font-size: 14px; font-weight: 600; }
.bal-res[data-st="def"] b { color: var(--sky); }
.bal-res[data-st="sur"] b { color: var(--peach); }
.bal-sum { font-size: 14px; margin-bottom: 8px; }
.chart .b-def { fill: var(--sky); }
.chart .b-sur { fill: var(--peach); }
.act-chip { display: inline-flex; align-items: baseline; gap: 6px; }
.act-chip em { font-style: normal; font-size: 11px; font-weight: 500; color: var(--ink-3); }

// ---------- Tiện ích ----------
const $ = (s, r = document) => r.querySelector(s);

const NF0 = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 });

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const parseNum = (s) => { if (s == null) return NaN; const t = String(s).trim().replace(/\s/g, '').replace(',', '.'); return t === '' ? NaN : Number(t); };
const ic = (id, cls = '') => `<svg class="icon ${cls}"><use href="#${id}"/></svg>`;
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd')

}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// ---------- Ngày tháng ----------
const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const dateOf = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
const WD = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
const WDS = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const longDate = (k) => { const d = dateOf(k); return `${WD[d.getDay()]}, ${d.getDate()} tháng ${d.getMonth() + 1}`; };
const shortDate = (k) => { const d = dateOf(k); return `${d.getDate()}/${d.getMonth() + 1}`; };
function relDay(k) {
  const t = todayKey();
  if (k === t) return 'Hôm nay';

  return dateOf(k).getFullYear() === new Date().getFullYear() ? shortDate(k) : `${shortDate(k)}/${dateOf(k).getFullYear()}`;
}
const monthKey = (k) => 'm-' + k.slice(0, 7);

// ---------- Thực phẩm ----------
const MEALS = [
  { k: 's', name: 'Bữa sáng' },

const mealName = (k) => (MEALS.find((m) => m.k === k) || MEALS[3]).name;
function mealByClock() {
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  if (h < 10.5) return 's';
  if (h < 14.5) return 't';
  if (h < 17) return 'p';
  if (h < 21.5) return 'c';

}
const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function parsePortions(str) {
  return String(str || '').split('|').filter(Boolean).map((p) => {
    const i = p.lastIndexOf(':');
    return { label: p.slice(0, i), g: Number(p.slice(i + 1)) };
  });
}
function makeFood(o) {
  const f = Object.assign({}, o);
  f.nn = norm(f.name);
  f.al = String(f.alias || '').split(',').map((s) => norm(s)).filter(Boolean);
  return f;
}
const BASE = FOOD_ROWS.map((r) => makeFood({
  id: 'f-' + slug(r[0]), name: r[0], cat: r[1], k: r[2], c: r[3], p: r[4], f: r[5], x: r[6], portions: parsePortions(r[7]), alias: r[8]
}));
let FOODS = new Map();
function rebuildFoods() {
  FOODS = new Map();
  BASE.forEach((f) => FOODS.set(f.id, f));
  (S.custom || []).forEach((c) => FOODS.set(c.id, makeFood(Object.assign({ cat: 'my' }, c))));
}
const foodByName = (name) => BASE.find((f) => f.name === name);

function searchFoods(q, limit = 60) {
  const qn = norm(q);
  if (!qn) return [];
  const toks = qn.split(' ');
  const fav = new Set(S.fav || []), rec = new Set(S.recent || []);
  const out = [];
  FOODS.forEach((f) => {
    const nn = f.nn;
    let s = 0;
    if (nn === qn) s = 100;
    else if (f.al.includes(qn)) s = 92;
    else if (nn.startsWith(qn)) s = 90;
    else if ((' ' + nn).includes(' ' + qn)) s = 80;
    else if (f.al.some((a) => a.startsWith(qn))) s = 74;
    else if (nn.includes(qn)) s = 70;
    else if (f.al.some((a) => a.includes(qn))) s = 64;
    else {
      const words = (nn + ' ' + f.al.join(' ')).split(' ');
      const hit = toks.filter((t) => words.some((w) => w.startsWith(t))).length;
      const r = hit / toks.length;
      if (r === 1) s = 58; else if (r >= 0.5) s = 40 * r;
    }
    if (!s) return;
    if (f.cat === 'my') s += 3;
    if (fav.has(f.id)) s += 2;
    if (rec.has(f.id)) s += 1;
    out.push({ f, s });
  });
  out.sort((a, b) => b.s - a.s || a.f.name.length - b.f.name.length);
  return out.slice(0, limit).map((o) => o.f);
}

// ---------- Gõ nhanh: "cơm trắng 1 bát, 2 quả trứng luộc, sữa 200ml" ----------
const UNIT_G = { g: 1, gr: 1, gam: 1, gram: 1, kg: 1000, ml: 1, l: 1000, lit: 1000 };
const PORTION_WORDS = ['bat', 'to', 'qua', 'cai', 'o', 'coc', 'ly', 'lon', 'hop', 'goi', 'dia', 'suat', 'mieng', 'lat', 'thia', 'muong', 'chen', 'cuon', 'phan', 'nam', 'khuc', 'bia', 'hu', 'chai', 'lang', 'chum', 'mui', 'cu', 'bo', 'con', 'vien', 'khoanh', 'thanh', 'nam', 'bich', 'cay', 'hat'];
const NUM_WORDS = { mot: 1, hai: 2, ba: 3, bon: 4, tu: 4, nam: 5, sau: 6, bay: 7, tam: 8, chin: 9, muoi: 10, nua: 0.5 };
function parseQuick(text) {
  const chunks = String(text || '').split(/[\n,;+]|\s(?:và|với|va|voi)\s/i).map((s) => s.trim()).filter(Boolean);
  return chunks.map((raw) => {
    let s = ' ' + norm(raw).replace(/(\d),(\d)/g, '$1.$2') + ' ';
    let grams = null, count = null, unit = null, m;
    const reG = /\s(\d+(?:\.\d+)?)\s*(kg|gram|gam|gr|g|ml|lit|l)(?=\s)/;
    const reP = new RegExp('\\s(\\d+(?:\\.\\d+)?|' + Object.keys(NUM_WORDS).join('|') + ')\\s+(' + PORTION_WORDS.join('|') + ')(\\s+ruoi)?(?=\\s)');
    if ((m = s.match(reG))) {
      grams = Number(m[1]) * UNIT_G[m[2]];
      s = s.replace(m[0], ' ');
    } else if ((m = s.match(reP))) {
      count = NUM_WORDS[m[1]] != null ? NUM_WORDS[m[1]] : Number(m[1]);
      if (m[3]) count += 0.5;
      unit = m[2];
      s = s.replace(m[0], ' ');
    } else if ((m = s.match(/\s(\d+(?:\.\d+)?)(?=\s)/))) {
      const n = Number(m[1]);
      if (n >= 15) grams = n; else count = n;
      s = s.replace(m[0], ' ');
    }
    const name = s.replace(/\s+/g, ' ').trim();
    const food = name ? searchFoods(name, 1)[0] : null;
    const r = { raw, name, food: null, g: 0, label: '' };
    if (!food) return r;
    r.food = food;
    if (grams != null) { r.g = grams; r.label = `${fg(grams)} g`; return r; }
    const ps = food.portions || [];
    let por = null;
    if (unit) por = ps.find((p) => norm(p.label).split(' ')[0] === unit);
    if (!por && unit === 'lang') por = { label: 'lạng', g: 100 };
    if (!por) por = ps[0] || { label: 'phần', g: 100 };
    const c = count == null ? 1 : count;
    r.g = Math.round(c * por.g);
    r.label = `${fq(c)} ${por.label} · ${fg(r.g)} g`;
    return r;
  });
}

// ---------- Vận động ----------
const ACT = new Map(ACTS.map((a) => [a.id, Object.assign(a, { al: [norm(a.name), ...a.alias.split(',').map(norm)].filter(Boolean) })]));
const MODE_NAME = { dist: 'Quãng đường', time: 'Thời gian', steps: 'Số bước', reps: 'Số lần', floors: 'Số tầng' };
function interp(tbl, x) {
  if (x <= tbl[0][0]) return tbl[0][1];
  for (let i = 1; i < tbl.length; i++) {
    if (x <= tbl[i][0]) { const [x0, y0] = tbl[i - 1], [x1, y1] = tbl[i]; return y0 + (y1 - y0) * (x - x0) / (x1 - x0); }
  }
  return tbl[tbl.length - 1][1];
}
const stepLenKm = (h) => 0.415 * (+h || 165) / 100 / 1000;   // chiều dài bước ≈ 41,5% chiều cao
const defLv = (a) => Math.floor((a.lv.length - 1) / 2);
// e: { a, mode, km, min, steps, sets, reps, floors, lv } → { kcal, met?, detail, how }
function actCalc(e, W, H) {
  const a = ACT.get(e.a);
  if (!a) return { kcal: e.kcal || 0, detail: e.min ? `${e.min} phút` : '', how: '' };
  const lv = a.lv[Math.min(e.lv == null ? defLv(a) : e.lv, a.lv.length - 1)];
  const kg = NF1.format(W);
  if (e.mode === 'dist') {
    const km = +e.km || 0, min = +e.min || 0;
    if (min > 0 && a.speed && km > 0) {
      const v = km / (min / 60), met = interp(a.speed, v);
      const fast = (a.id === 'run' && v > 22) || (a.id === 'walk' && v > 9) || (a.id === 'bike' && v > 45) || (a.id === 'swim' && v > 6);
      return { kcal: met * W * min / 60, detail: `${NF2.format(km)} km · ${fq(min)} phút (${NF1.format(v)} km/h)`, how: (fast ? `Tốc độ ${NF1.format(v)} km/h có vẻ quá nhanh, hãy kiểm tra lại thời gian. ` : '') + `Tốc độ ${NF1.format(v)} km/h → MET ${NF1.format(met)} × ${kg} kg × ${fq(min)} phút ÷ 60` };
    }
    return { kcal: (a.perKm || 0) * W * km, detail: `${NF2.format(km)} km`, how: `${NF2.format(a.perKm)} kcal × ${kg} kg × ${NF2.format(km)} km` };
  }
  if (e.mode === 'steps') {
    const steps = +e.steps || 0, km = steps * stepLenKm(H);
    return { kcal: (a.perKm || 0.72) * W * km, detail: `${NF0.format(steps)} bước ≈ ${NF1.format(km)} km`, how: `${NF0.format(steps)} bước × ${NF2.format(stepLenKm(H) * 1000)} m/bước ≈ ${NF1.format(km)} km; ${NF2.format(a.perKm)} kcal × ${kg} kg × km` };
  }
  if (e.mode === 'reps') {
    const sets = Math.max(1, +e.sets || 1), reps = +e.reps || 0, n = sets * reps;
    return { kcal: (a.perRep || 0) * W * n, detail: sets > 1 ? `${sets} hiệp × ${reps} lần` : `${reps} lần`, how: `${n} lần × ${NF2.format((a.perRep || 0) * W)} kcal/lần (theo ${kg} kg)` };
  }
  if (e.mode === 'floors') {
    const f = +e.floors || 0;
    return { kcal: (a.perFloor || 0) * W * f, detail: `${f} tầng`, how: `${f} tầng × ${NF2.format((a.perFloor || 0) * W)} kcal/tầng (theo ${kg} kg)` };
  }
  const min = +e.min || 0;
  return { kcal: lv[1] * W * min / 60, met: lv[1], detail: `${fq(min)} phút · ${lv[0].toLowerCase()}`, how: `MET ${NF1.format(lv[1])} × ${kg} kg × ${fq(min)} phút ÷ 60` };
}
function actByText(t) {
  const s = ' ' + t + ' ';
  let best = null, len = 0;
  ACT.forEach((a) => a.al.forEach((al) => { if (al.length > len && s.includes(' ' + al + ' ')) { best = a; len = al.length; } }));
  return best;
}
// "chạy bộ 2 km 12 phút, kéo xà 3x10, đi bộ 8.000 bước, HIIT 10p, leo 5 tầng, plank 90 giây"
function parseActs(text) {
  const chunks = String(text || '').split(/[\n,;+]|\s(?:và|va)\s/i).map((x) => x.trim()).filter(Boolean);
  return chunks.map((raw) => {
    let s = ' ' + norm(raw).replace(/(\d),(\d)/g, '$1.$2') + ' ';
    const a = actByText(s);
    const r = { raw, a: a ? a.id : null };
    if (!a) return r;
    let m;
    const num = (x) => Number(x);
    if ((m = s.match(/\s(\d{1,3}(?:\.\d{3})+|\d+(?:\.\d+)?)\s*(k)?\s*(buoc|step|steps)(?=\s)/))) {
      let v = m[1].includes('.') && /^\d{1,3}(\.\d{3})+$/.test(m[1]) ? num(m[1].replace(/\./g, '')) : num(m[1]);
      if (m[2]) v *= 1000;
      r.steps = Math.round(v); s = s.replace(m[0], ' ');
    }
    if ((m = s.match(/\s(\d+(?:\.\d+)?)\s*km(?=\s)/))) { r.km = num(m[1]); s = s.replace(m[0], ' '); }
    else if ((m = s.match(/\s(\d+)\s*(m|met|mét)(?=\s)/))) { r.km = num(m[1]) / 1000; s = s.replace(m[0], ' '); }
    if ((m = s.match(/\s(\d+(?:\.\d+)?)\s*(gio|h|tieng)(?=\s)/))) { r.min = num(m[1]) * 60; s = s.replace(m[0], ' '); }
    if ((m = s.match(/\s(\d+(?:\.\d+)?)\s*(phut|ph|p|min|mins|')(?=\s)/))) { r.min = (r.min || 0) + num(m[1]); s = s.replace(m[0], ' '); }
    if ((m = s.match(/\s(\d+)\s*(giay|s|sec|giây)(?=\s)/))) { r.min = (r.min || 0) + num(m[1]) / 60; s = s.replace(m[0], ' '); }
    if ((m = s.match(/\s(\d+)\s*(?:x|\*|hiep|set|sets)\s*(\d+)(?:\s*(?:lan|cai|rep|reps))?(?=\s)/))) { r.sets = num(m[1]); r.reps = num(m[2]); s = s.replace(m[0], ' '); }
    else if ((m = s.match(/\s(\d+)\s*(lan|cai|rep|reps|qua|nhip)(?=\s)/))) { r.sets = 1; r.reps = num(m[1]); s = s.replace(m[0], ' '); }
    if ((m = s.match(/\s(\d+)\s*(tang|lau)(?=\s)/))) { r.floors = num(m[1]); s = s.replace(m[0], ' '); }
    if (r.steps == null && r.km == null && r.min == null && r.reps == null && r.floors == null && (m = s.match(/\s(\d+(?:\.\d+)?)(?=\s)/))) {
      const v = num(m[1]), first = a.modes[0];
      if (first === 'reps') { r.sets = 1; r.reps = v; } else if (first === 'floors') r.floors = v;
      else if (first === 'steps' && v >= 100) r.steps = v; else if (first === 'dist' && v <= 60) r.km = v; else r.min = v;
    }
    if (r.steps != null && a.modes.includes('steps')) r.mode = 'steps';
    else if (r.km != null && a.modes.includes('dist')) r.mode = 'dist';
    else if (r.floors != null && a.modes.includes('floors')) r.mode = 'floors';
    else if (r.reps != null && a.modes.includes('reps')) r.mode = 'reps';
    else if (r.min != null && a.modes.includes('time')) r.mode = 'time';
    if (/\s(nhanh|manh|cao|nang|thi dau|doi khang)\s/.test(s)) r.lv = a.lv.length - 1;
    else if (/\s(cham|nhe|thong tha|nhe nhang)\s/.test(s)) r.lv = 0;
    return r;

// Calo đã tiêu trong ngày: BMR + sinh hoạt nhẹ (10% BMR) + tiêu hoá thức ăn (10% năng lượng ăn vào) + vận động đã ghi

const STYLES = {

  custom: { name: 'Tự chọn %', desc: 'Tự đặt tỉ lệ carb / đạm / béo' }

function bmiCat(b) {
  if (b < 18.5) return { name: 'Thiếu cân', st: 'low' };
  if (b < 23) return { name: 'Bình thường', st: 'ok' };
  if (b < 25) return { name: 'Thừa cân', st: 'low' };
  if (b < 30) return { name: 'Béo phì độ I', st: 'high' };
  return { name: 'Béo phì độ II', st: 'high' };
}
function calc(p) {
  const w = clamp(+p.weight || 60, 25, 300), h = clamp(+p.height || 165, 100, 230), a = clamp(+p.age || 25, 10, 100);
  const hm = h / 100;
  const bmi = w / (hm * hm);
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === 'm' ? 5 : -161);
  const tdee = bmr * (+p.act || 1.375);
  const rate = p.goal === 'keep' ? 0 : (+p.rate || 0.5);
  const delta = p.goal === 'lose' ? -rate * 7700 / 7 : p.goal === 'gain' ? rate * 7700 / 7 : 0;
  const notes = [];

  const floor = p.sex === 'm' ? 1500 : 1200;
  if (kcal < floor) { kcal = floor; notes.push(`Mục tiêu được giữ ở mức tối thiểu an toàn ${fk(floor)} kcal. Hãy chọn tốc độ giảm chậm hơn.`); }
  if (p.goal === 'lose' && kcal < bmr) notes.push('Mục tiêu đang thấp hơn mức chuyển hoá cơ bản (BMR). Giảm quá nhanh dễ mất cơ và mệt mỏi.');
  if (a < 18) notes.push('Công thức này dành cho người từ 18 tuổi. Người dưới 18 tuổi nên hỏi ý kiến bác sĩ dinh dưỡng.');
  kcal = Math.round(kcal / 10) * 10;
  let P, F, C;
  if (p.style === 'custom') {
    const cc = +(p.custom || {}).c || 50, cp = +(p.custom || {}).p || 20, cf = +(p.custom || {}).f || 30;
    const sum = cc + cp + cf || 100;
    C = kcal * cc / sum / 4; P = kcal * cp / sum / 4; F = kcal * cf / sum / 9;
  } else {
    const st = STYLES[p.style] || STYLES.balanced;
    const baseW = bmi > 27 ? 25 * hm * hm : w;           // người BMI cao: tính đạm theo cân nặng điều chỉnh
    P = (st.pk[p.goal] || 1.4) * baseW;

  if (tw && rate && ((p.goal === 'lose' && tw < w) || (p.goal === 'gain' && tw > w))) eta = Math.ceil(Math.abs(w - tw) / rate);
  return {
    bmi, cat: bmiCat(bmi), bmr, tdee, delta, ideal, eta, water: Math.round(w * 35 / 100) / 10, notes,
    t: { k: kcal, c: Math.round(C), p: Math.round(P), f: Math.round(F), x: X }
  };
}

// ---------- Ngày & tổng ----------
function getDay(k, create) {
  let d = S.days[k];
  if (!d && create) d = S.days[k] = { items: [], acts: [] };
  return d || { items: [], acts: [] };
}
function sumItems(items) {
  const t = { k: 0, c: 0, p: 0, f: 0, x: 0 };
  items.forEach((it) => { const r = it.g / 100; t.k += it.v[0] * r; t.c += it.v[1] * r; t.p += it.v[2] * r; t.f += it.v[3] * r; t.x += it.v[4] * r; });
  return t;
}
function targetsFor(k) {
  const d = S.days[k];
  if (d && d.t && k < todayKey()) return d.t;
  return calc(S.profile).t;
}
function dayInfo(k) {
  const d = getDay(k);
  const tot = sumItems(d.items);
  const burned = (d.acts || []).reduce((s, a) => s + (a.kcal || 0), 0);
  const T = targetsFor(k);
  const allow = T.k + (S.settings.burnBack ? burned : 0);
  const has = d.items.length > 0;
  return {
    d, tot, burned, T, allow, has,
    st: has ? kStatus(tot.k, allow) : 'none',
    ms: { c: mStatus('c', tot.c, T.c), p: mStatus('p', tot.p, T.p), f: mStatus('f', tot.f, T.f), x: mStatus('x', tot.x, T.x) }
  };
}

const Store = {

function touch(k) {

function normalizeState(st) {

  const hadGoal = st && st.profile && st.profile.goalSet !== undefined;
  o.profile = Object.assign(blankState().profile, o.profile || {});

  if (!o.days || typeof o.days !== 'object') o.days = {};
  Object.values(o.days).forEach((d) => { d.items = Array.isArray(d.items) ? d.items : []; d.acts = Array.isArray(d.acts) ? d.acts : []; });
  o.meta = o.meta || {};

const Cloud = {
  db: null, uid: null, dirty: new Set(), timer: null, busy: false, onChange: null,
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.db = db; this.uid = id;
      await this.pull();
    } catch (e) { this.db = null; }
  },
  col() { return this.db.collection('data/users/' + this.uid); },
  payload(key) {
    if (key === 'core') {
      const { days, meta, ...core } = S;
      return Object.assign({}, JSON.parse(JSON.stringify(core)), { updatedAt: (S.meta && S.meta.core) || Date.now() });
    }
    const ym = key.slice(2);
    const days = {};
    Object.keys(S.days).forEach((k) => { if (k.startsWith(ym)) days[k] = S.days[k]; });
    return { days: JSON.parse(JSON.stringify(days)), updatedAt: (S.meta && S.meta[key]) || Date.now() };
  },
  allKeys() {
    const ks = new Set(['core']);
    Object.keys(S.days).forEach((k) => ks.add(monthKey(k)));
    return ks;
  },
  async pull() {
    const snap = await this.col().get();
    const remote = {};
    snap.docs.forEach((d) => { if (d.exists) remote[d.id] = d.data(); });
    const rk = Object.keys(remote);
    if (!rk.length) {
      if (!S.demo) { this.allKeys().forEach((k) => this.dirty.add(k)); this.flushSoon(); }
      return;
    }
    let changed = false;
    if (S.demo && remote.core) {           // máy mới: lấy toàn bộ dữ liệu thật đã lưu
      const core = Object.assign({}, remote.core); delete core.updatedAt;
      const ns = normalizeState(Object.assign(core, { days: {}, meta: {} }));
      rk.filter((k) => k.startsWith('m-')).forEach((k) => { Object.assign(ns.days, remote[k].days || {}); ns.meta[k] = remote[k].updatedAt || 0; });
      ns.meta.core = remote.core.updatedAt || 0;
      S = normalizeState(ns);
      changed = true;
    } else {
      S.meta = S.meta || {};
      rk.forEach((k) => {
        const r = remote[k], lt = S.meta[k] || 0, rt = r.updatedAt || 0;
        if (rt > lt) {
          if (k === 'core') {
            const core = Object.assign({}, r); delete core.updatedAt;
            const keep = { days: S.days, meta: S.meta };
            S = normalizeState(Object.assign({}, core, keep));
          } else {
            const ym = k.slice(2);
            Object.keys(S.days).forEach((d) => { if (d.startsWith(ym)) delete S.days[d]; });
            Object.assign(S.days, r.days || {});
          }
          S.meta[k] = rt; changed = true;
        } else if (lt > rt) this.dirty.add(k);
      });
      this.allKeys().forEach((k) => { if (!remote[k] && !S.demo) this.dirty.add(k); });
      this.flushSoon();
    }
    if (changed) { Store.saveNow(); rebuildFoods(); if (this.onChange) this.onChange(); }
  },
  mark(key) {
    if (!this.db || S.demo) return;
    this.dirty.add(key);
    this.flushSoon();
  },
  flushSoon() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1500); },
  async flush() {
    if (!this.db || this.busy || S.demo) return;
    this.busy = true;
    try {
      while (this.dirty.size) {
        const key = this.dirty.values().next().value;
        this.dirty.delete(key);
        try { await this.col().doc(key).set(this.payload(key)); }
        catch (e) {
          if (e && e.code === 'unavailable') { this.dirty.add(key); await new Promise((r) => setTimeout(r, 2000 + Math.random() * 1500)); }
          else if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'invalid_argument')) { this.db = null; break; }
        }
      }
    } finally { this.busy = false; }
  },
  async wipe() {
    if (!this.db) return;
    try { const snap = await this.col().get(); for (const d of snap.docs) await this.col().doc(d.id).delete(); } catch (e) { /* bỏ qua */ }
  }
};

// ---------- Đĩa (hero) ----------
function arc(r, len, total, cls, w, off = 0, extra = '') {
  return `<circle cx="120" cy="120" r="${r}" fill="none" class="${cls}" stroke-width="${w}" stroke-dasharray="${len.toFixed(2)} ${total.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 120 120)" ${extra}/>`;
}
function plateSVG(info, anim) {
  const rimR = 105, rimW = 16, Cr = 2 * Math.PI * rimR;

  const first = Math.min(ratio, 1), over = Math.max(0, Math.min(ratio - 1, 1));
  let s = `<svg viewBox="0 0 240 240" aria-hidden="true">
    <circle cx="120" cy="120" r="119" class="plate-dish-shadow"/>
    <circle cx="120" cy="120" r="${rimR}" fill="none" class="plate-rim-track" stroke-width="${rimW}"/>`;
  if (first > 0) s += arc(rimR, first * Cr, Cr, 'plate-rim' + (anim ? ' anim' : ''), rimW, 0, `stroke-linecap="round" style="--len:${(first * Cr).toFixed(1)}"`);
  if (over > 0) s += arc(rimR, over * Cr, Cr, 'plate-over', rimW - 8, 0, 'stroke-linecap="round"');
  s += `<circle cx="120" cy="120" r="92" class="plate-dish"/>`;
  const r = 71, Cf = 2 * Math.PI * r, w = 15;
  const kc = info.tot.c * 4, kp = info.tot.p * 4, kf = info.tot.f * 9, sum = kc + kp + kf;
  if (sum > 0) {
    const segs = [[kc, 'var(--carb)'], [kp, 'var(--pro)'], [kf, 'var(--fat)']].filter((x) => x[0] > 0);
    const gap = segs.length > 1 ? 3 : 0;
    let off = 0;
    segs.forEach(([v, col]) => {
      const len = Math.max(0, Cf * v / sum - gap);
      s += `<circle cx="120" cy="120" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="${len.toFixed(2)} ${Cf.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 120 120)"/>`;

function niceGrams(food, g, capMul = 1) {
  const p = (food.portions || [])[0];
  if (p && p.g >= 20) {
    const cnt = clamp(Math.round(g / p.g * 2) / 2, 0.5, capMul);
    return { g: cnt * p.g, label: `${fq(cnt)} ${p.label}` };
  }
  const gg = clamp(Math.round(g / 10) * 10, 30, 150 * capMul);
  return { g: gg, label: `${gg} g` };
}
function shuffled(names, seedKey) {
  const rnd = seeded(hashStr(seedKey));
  return names.map(foodByName).filter(Boolean).map((f) => ({ f, r: rnd() })).sort((a, b) => a.r - b.r).map((o) => o.f);
}
function suggestFor(m, gap, kcalLeft, seedKey, skip = []) {
  const out = [];
  for (const f of shuffled(SUGG[m], seedKey + m)) {
    const v = f[m]; if (!v || skip.includes(f.id)) continue;
    const ng = niceGrams(f, gap / v * 100, 1);
    const kcal = f.k * ng.g / 100;
    if (kcalLeft != null && kcal > kcalLeft + 60 && m !== 'x') continue;
    out.push({ f, g: ng.g, label: ng.label, kcal, got: v * ng.g / 100 });
    if (out.length === 2) break;
  }
  return out;
}
function mealCombo(gap, info, seedKey) {
  if (gap < 300) {
    const out = [];
    for (const f of shuffled(['Sữa chua Hy Lạp', 'Chuối', 'Táo', 'Sữa đậu nành không đường', 'Ổi', 'Trứng gà luộc', 'Hạt điều'], seedKey + 's')) {
      const p = f.portions[0]; const kcal = f.k * p.g / 100;
      if (kcal <= gap + 60) out.push({ f, g: p.g, label: `1 ${p.label}`, kcal });
      if (out.length === 3) break;
    }
    return { snack: true, items: out };
  }
  const veg = shuffled(['Rau luộc', 'Súp lơ xanh', 'Canh rau', 'Cải ngọt / cải chíp', 'Dưa chuột'], seedKey + 'v')[0];
  const pro = shuffled(SUGG.p, seedKey + 'p')[0];
  const carb = shuffled(['Cơm trắng', 'Cơm gạo lứt', 'Khoai lang (luộc)', 'Bún tươi', 'Bánh mì nguyên cám'], seedKey + 'c')[0];
  const items = [];
  const vp = veg.portions[0]; items.push({ f: veg, g: vp.g, label: `1 ${vp.label}`, kcal: veg.k * vp.g / 100 });
  const pNeed = clamp(info.T.p - info.tot.p, 20, 45);
  let pg = niceGrams(pro, pNeed / pro.p * 100, 2);
  if (pro.k * pg.g / 100 + items[0].kcal > gap + 80) pg = niceGrams(pro, 0, 1);
  items.unshift({ f: pro, g: pg.g, label: pg.label, kcal: pro.k * pg.g / 100 });
  const left = gap - items.reduce((s, i) => s + i.kcal, 0);
  if (left > 70) {
    const cg = niceGrams(carb, left / carb.k * 100, (carb.portions[0] || { g: 100 }).g < 60 ? 4 : 2);
    items.splice(1, 0, { f: carb, g: cg.g, label: cg.label, kcal: carb.k * cg.g / 100 });
  }
  const left2 = gap - items.reduce((s, i) => s + i.kcal, 0);
  if (left2 > 120) {
    const ex = shuffled(['Chuối', 'Sữa chua Hy Lạp', 'Hạt điều', 'Quả bơ', 'Táo', 'Sữa đậu nành không đường'], seedKey + 'e')
      .map((f) => ({ f, p: f.portions[0] })).find((o) => o.f.k * o.p.g / 100 <= left2 + 60);
    if (ex) items.push({ f: ex.f, g: ex.p.g, label: `1 ${ex.p.label}`, kcal: ex.f.k * ex.p.g / 100 });
  }
  return { snack: false, items };
}
const MUNIT = { p: 'đạm', x: 'xơ', c: 'carb', f: 'béo' };
function suggButtons(list, meal, m) {

// -- Biểu đồ cân bằng năng lượng
function balanceChart(keys, width) {
  const H = 210, L = 52, R = 14, T = 16, B = 30, n = keys.length;
  const vals = keys.map((k) => { const d = getDay(k); return d.items.length ? sumItems(d.items).k - burnInfo(k).fullDay : null; });
  const m = Math.max(500, ...vals.filter((v) => v != null).map((v) => Math.abs(v)));
  const step = m > 1600 ? 1000 : 500, top = Math.ceil(m / step) * step;
  const iw = width - L - R, ih = H - T - B, cw = iw / n;
  const y = (v) => T + ih / 2 - (v / top) * (ih / 2);
  const bw = Math.max(4, Math.min(26, cw * 0.6));
  let s = `<svg class="chart" viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="Biểu đồ cân bằng năng lượng mỗi ngày">`;
  [-top, 0, top].forEach((v) => { s += `<line class="grid" x1="${L}" x2="${width - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? '+' : v < 0 ? '−' : ''}${fk(Math.abs(v))}</text>`; });
  vals.forEach((v, i) => {
    if (v == null) return;
    const x = L + cw * (i + 0.5) - bw / 2, y0 = y(0), y1 = y(v);
    s += `<rect class="${v < 0 ? 'b-def' : 'b-sur'}" x="${x.toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(y1 - y0)).toFixed(1)}" rx="${Math.min(6, bw / 2).toFixed(1)}"><title>${shortDate(keys[i])}: ${v < 0 ? 'thâm hụt' : 'dư'} ${fk(Math.abs(v))} kcal</title></rect>`;
  });
  const every = n <= 7 ? 1 : n <= 14 ? 2 : 5;
  keys.forEach((k, i) => { if ((n - 1 - i) % every) return; const d = dateOf(k); s += `<text x="${L + cw * (i + 0.5)}" y="${H - 9}" text-anchor="middle">${n <= 7 ? WDS[d.getDay()] + ' ' + d.getDate() : shortDate(k)}</text>`; });
  const tot = vals.reduce((a, v) => a + (v || 0), 0);
  return { svg: s + '</svg>', tot, days: vals.filter((v) => v != null).length };
}

// ---------- Tiến trình ----------
function kcalChart(keys, width) {
  const H = 236, L = 46, R = 14, T = 22, B = 30, n = keys.length;
  const infos = keys.map(dayInfo);
  const vals = infos.map((i) => (i.has ? i.tot.k : 0)), tgs = infos.map((i) => i.allow);
  const step = Math.max(...vals, ...tgs) > 3200 ? 1000 : 500;
  const max = Math.max(step * 2, Math.ceil(Math.max(...vals, ...tgs) * 1.08 / step) * step);
  const iw = width - L - R, ih = H - T - B, cw = iw / n;
  const x = (i) => L + cw * (i + 0.5), y = (v) => T + ih * (1 - v / max);
  const bw = Math.max(4, Math.min(30, cw * 0.62));
  let s = `<svg class="chart" viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="Biểu đồ calo theo ngày so với mục tiêu">`;
  for (let v = 0; v <= max; v += step) s += `<line class="grid" x1="${L}" x2="${width - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fk(v)}</text>`;
  infos.forEach((info, i) => {
    if (info.has) {
      const top = y(vals[i]);
      s += `<rect class="b-${info.st}" x="${(x(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${(T + ih - top).toFixed(1)}" rx="${Math.min(7, bw / 2).toFixed(1)}"><title>${shortDate(keys[i])}: ${fk(vals[i])} / ${fk(tgs[i])} kcal</title></rect>`;
    } else s += `<rect class="b-none" x="${(x(i) - bw / 2).toFixed(1)}" y="${T + ih - 3}" width="${bw.toFixed(1)}" height="3" rx="1.5"/>`;
  });
  const pts = []; tgs.forEach((t, i) => { pts.push(`${(L + cw * i).toFixed(1)},${y(t).toFixed(1)}`, `${(L + cw * (i + 1)).toFixed(1)},${y(t).toFixed(1)}`); });
  s += `<polyline class="tline" fill="none" points="${pts.join(' ')}"/>`;
  s += `<text class="tlabel" x="${width - R}" y="${y(tgs[n - 1]) - 7}" text-anchor="end">Mục tiêu</text>`;
  const every = n <= 7 ? 1 : n <= 14 ? 2 : 5;
  keys.forEach((k, i) => {
    if ((n - 1 - i) % every) return;
    const d = dateOf(k);
    s += `<text x="${x(i)}" y="${H - 9}" text-anchor="middle">${n <= 7 ? WDS[d.getDay()] + ' ' + d.getDate() : shortDate(k)}</text>`;
  });
  return s + '</svg>';
}
function weightChart(points, width, from, to, tw) {
  const H = 210, L = 46, R = 46, T = 18, B = 28;
  const span = Math.max(1, (dateOf(to) - dateOf(from)) / 864e5);
  const kgs = points.map((p) => p.kg);
  let lo = Math.min(...kgs), hi = Math.max(...kgs);
  if (tw && Math.abs(tw - lo) < 4) { lo = Math.min(lo, tw); hi = Math.max(hi, tw); }
  lo = Math.floor(lo - 0.5); hi = Math.ceil(hi + 0.5);
  const iw = width - L - R, ih = H - T - B;
  const x = (k) => L + iw * ((dateOf(k) - dateOf(from)) / 864e5) / span, y = (v) => T + ih * (1 - (v - lo) / (hi - lo));
  const st = (hi - lo) > 6 ? 2 : 1;
  let s = `<svg class="chart" viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="Biểu đồ cân nặng">`;
  for (let v = lo; v <= hi; v += st) s += `<line class="grid" x1="${L}" x2="${width - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  if (tw && tw >= lo && tw <= hi) s += `<line class="tline" x1="${L}" x2="${width - R}" y1="${y(tw)}" y2="${y(tw)}"/><text class="tlabel" x="${L + 4}" y="${y(tw) - 6}">Mục tiêu ${fg(tw)} kg</text>`;
  const pp = points.map((p) => [x(p.d), y(p.kg)]);
  if (pp.length > 1) {
    s += `<path class="warea" d="M${pp[0][0]},${T + ih} ${pp.map((p) => `L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} L${pp[pp.length - 1][0]},${T + ih} Z"/>`;
    s += `<polyline class="wline" points="${pp.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' ')}"/>`;
  }
  pp.forEach((p, i) => { s += `<circle class="${i === pp.length - 1 ? 'wlast' : 'wdot'}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === pp.length - 1 ? 5.5 : 4}"/>`; });
  const last = pp[pp.length - 1];
  s += `<text class="tlabel" x="${Math.min(width - 4, last[0] + 8)}" y="${last[1] + 4}">${NF1.format(points[points.length - 1].kg)}</text>`;
  s += `<text x="${L}" y="${H - 8}">${shortDate(from)}</text><text x="${width - R}" y="${H - 8}" text-anchor="end">${shortDate(to)}</text>`;
  return s + '</svg>';
}

// Hiệu ứng sau khi bấm OK: khung mục tiêu nảy nhẹ và các con số chạy từ giá trị cũ sang mới
function revealTargets(oldT) {
  const panel = $('#targets-panel'); if (!panel) return;
  const T = calc(S.profile).t;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  panel.classList.remove('reveal'); void panel.offsetWidth; panel.classList.add('reveal');
  try { panel.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); } catch (e) { panel.scrollIntoView(); }
  if (reduce) return;
  $$('[data-count]', panel).forEach((el) => {
    const k = el.dataset.count, to = T[k], from = oldT ? oldT[k] : 0;
    if (from === to) return;
    const t0 = performance.now(), dur = 900;
    const step = (now) => {
      const r = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - r, 3);
      el.textContent = k === 'k' ? fk(from + (to - from) * e) : Math.round(from + (to - from) * e);
      if (r < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
